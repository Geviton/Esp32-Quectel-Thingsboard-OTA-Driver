name: CI Build System

on:
  workflow_dispatch:
    inputs:
      target_chip:
        description: 'Target Microcontroller (e.g., esp32, esp32s3, esp32c3)'
        required: true
        default: 'esp32s3'
      app_bin_name:
        description: 'Desired name for your application binary (without .bin extension)'
        required: true
        default: 'application_v1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Gives the runner permission to commit files back into this repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache ESP-IDF Tools & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.ccache
          key: ${{ runner.os }}-esp-idf-${{ github.event.inputs.target_chip }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-

      - name: Compile ESP32 Project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.3.1'
          target: ${{ github.event.inputs.target_chip }}
          path: '.'

      - name: Stage and Rename Binary Elements to Release Folder
        run: |
          mkdir -p Release
          
          # Copy standard bootloader and partition table straight to the local Release folder
          cp build/bootloader/bootloader.bin Release/bootloader.bin
          cp build/partition_table/partition-table.bin Release/partition-table.bin
          
          # Dynamically locate the main compiled app binary
          MAIN_BIN=$(find build -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" | head -n 1)
          
          if [ -n "$MAIN_BIN" ]; then
            # Copy straight to the local Release folder with your chosen input name
            cp "$MAIN_BIN" "Release/${{ github.event.inputs.app_bin_name }}.bin"
            echo "Successfully staged all 3 firmware binaries in the local Release folder."
          else
            echo "ERROR: Main application binary not found!" && exit 1
          fi
          
          echo "Current content of Release folder to push:"
          ls -l Release/

      - name: Commit and Push Firmware Fleet to Release Folder
        run: |
          # Configure a generic GitHub Actions bot profile for the commit
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Stage the entire Release folder contents
          git add Release/bootloader.bin
          git add Release/partition-table.bin
          git add Release/${{ github.event.inputs.app_bin_name }}.bin
          
          # Commit and push back to the current branch natively
          git commit -m "Automated Build: ${{ github.event.inputs.app_bin_name }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.role_name == '' && 'main' || github.ref_name }}
