name: CI Build System

on:
  workflow_dispatch:
    inputs:
      target_chip:
        description: 'Target Microcontroller (e.g., esp32, esp32s3, esp32c3)'
        required: true
        default: 'esp32s3'
      app_bin_name:
        description: 'Desired name for your application binary (without .bin extension)'
        required: true
        default: 'gsm_ota'
      release_version:
        description: 'Version Tag for OTA Link (e.g., v1.22)'
        required: true
        default: 'v1.22'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the token direct authorization to generate releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache ESP-IDF Tools & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.ccache
          key: ${{ runner.os }}-esp-idf-${{ github.event.inputs.target_chip }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-

      - name: Compile ESP32 Project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.3.1'
          target: ${{ github.event.inputs.target_chip }}
          path: '.'

      - name: Stage and Rename Binary Artifacts
        run: |
          mkdir -p firmware_binaries
          mkdir -p single_ota_bin
          
          # Copy standard bootloader and partition table to the archive folder
          cp build/bootloader/bootloader.bin firmware_binaries/bootloader.bin
          cp build/partition_table/partition-table.bin firmware_binaries/partition-table.bin
          
          # Dynamically locate the main compiled app binary
          MAIN_BIN=$(find build -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" | head -n 1)
          
          if [ -n "$MAIN_BIN" ]; then
            # Copy to fallback zip archive folder
            cp "$MAIN_BIN" "firmware_binaries/${{ github.event.inputs.app_bin_name }}_${{ github.event.inputs.release_version }}.bin"
            
            # Copy to isolated folder for the public Release asset pipeline
            cp "$MAIN_BIN" "single_ota_bin/${{ github.event.inputs.app_bin_name }}_${{ github.event.inputs.release_version }}.bin"
            echo "Staged application binary: ${{ github.event.inputs.app_bin_name }}_${{ github.event.inputs.release_version }}.bin"
          else
            echo "ERROR: Main application binary not found!" && exit 1
          fi

      - name: Upload Complete Binaries as Artifacts (Zipped Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_bin_name }}-binaries
          path: firmware_binaries/
          retention-days: 7

      - name: Generate Public GitHub Release and Attach Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: "Release ${{ github.event.inputs.release_version }}"
          body: "Automated production firmware binaries compiled via GitHub Actions CI pipeline."
          files: |
            single_ota_bin/${{ github.event.inputs.app_bin_name }}_${{ github.event.inputs.release_version }}.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
